<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Dark icon for light themes (transparent background) -->
  <!-- Left brace -->
  <text x="0.5" y="12" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#1a1a2e" transform="rotate(-12, 5, 9)">{</text>
  <!-- Right brace -->
  <text x="7.5" y="11" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#1a1a2e" transform="rotate(12, 11, 8)">}</text>
  <!-- Flame dot -->
  <circle cx="8" cy="1.8" r="1.2" fill="#ff6a00"/>
</svg>
